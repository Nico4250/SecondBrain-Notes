name: Backend Tests

on:
  push:
    branches:
      - main
      - develop
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Give execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test